<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洛带招商政策指引</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
:root{
  --ground:#EDEFEA; --paper:#F8F8F4; --paper-2:#E3E7E1;
  --ink:#1C2427; --ink-2:#465055; --ink-3:#7A8386;
  --line:#D3D8D1; --line-2:#B7BFB8;
  --tile:#1F292C; --tile-ink:#E9ECE6; --tile-ink-2:#A3ADAB;
  --seal:#A6342B; --seal-soft:#F3E3DF; --on-seal:#FFF7F3;
  --patina:#3E6B5F; --patina-soft:#DCE8E2;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
/* 招商手册为正式对外材料，固定浅色，不随系统深色模式切换（用户 2026-09-19 定） */
:root{color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--patina)}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* 页首：黛瓦色带 + 鱼鳞瓦纹 */
.mast{position:relative;background:var(--tile);color:var(--tile-ink);padding:52px 0 70px;overflow:hidden}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42px;pointer-events:none;
  background:
    radial-gradient(circle at 50% 0,transparent 10px,color-mix(in srgb,var(--tile-ink) 10%,transparent) 10.5px 12px,transparent 12.5px) 0 0/26px 14px repeat-x,
    radial-gradient(circle at 50% 0,transparent 10px,color-mix(in srgb,var(--tile-ink) 7%,transparent) 10.5px 12px,transparent 12.5px) 13px 14px/26px 14px repeat-x,
    radial-gradient(circle at 50% 0,transparent 10px,color-mix(in srgb,var(--tile-ink) 4%,transparent) 10.5px 12px,transparent 12.5px) 0 28px/26px 14px repeat-x}
.eyebrow{margin:0 0 14px;font-size:.8rem;letter-spacing:.18em;color:var(--tile-ink-2)}
.mast h1{font-family:var(--serif);font-weight:900;font-size:clamp(2.1rem,5.2vw,3.3rem);
  letter-spacing:.06em;line-height:1.2;margin:0 0 14px;text-wrap:balance}
.lede{margin:0;max-width:40em;color:var(--tile-ink-2);font-size:1rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:22px;font-size:.82rem;color:var(--tile-ink-2)}
.meta b{color:var(--tile-ink);font-weight:500}
.ed-tag{display:inline-block;margin-left:10px;padding:1px 8px;border:1px solid var(--seal);
  color:var(--seal);font-size:.72rem;letter-spacing:.1em;vertical-align:middle;border-radius:2px}
.mast .ed-tag{color:#E7988E;border-color:#E7988E}

/* 导航 */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 94%,transparent);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.bar a{flex:none;padding:13px 14px;font-size:.88rem;color:var(--ink-2);text-decoration:none;
  border-bottom:2px solid transparent}
.bar a:hover{color:var(--ink)}
.bar a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--seal);font-weight:500}

main{padding:10px 0 80px}
section.blk{padding:48px 0 8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--line-2);padding-bottom:10px;margin-bottom:22px}
.sec-h h2{font-family:var(--serif);font-weight:900;font-size:1.5rem;letter-spacing:.04em;margin:0}
.sec-h p{margin:0;font-size:.85rem;color:var(--ink-3)}

/* 层级印章 */
.seal{display:inline-grid;place-items:center;width:30px;height:30px;flex:none;border-radius:3px;
  font-family:var(--serif);font-weight:900;font-size:.92rem;line-height:1;
  color:var(--seal);border:1.5px solid var(--seal)}
.seal.lv-区{background:var(--seal);color:var(--on-seal);box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3px var(--on-seal)}
.seal.lv-省{color:var(--ink-2);border-color:var(--ink-3)}

/* 重点政策 */
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.fc{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);
  border-radius:4px;padding:18px 20px 16px;text-decoration:none;color:inherit;transition:border-color .15s}
.fc:hover,.fc:focus-visible{border-color:var(--patina)}
.fc-top{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--ink-3)}
.fc-amt{font-family:var(--serif);font-weight:900;font-size:2rem;line-height:1.15;color:var(--ink)}
.fc-amt small{font-family:var(--sans);font-weight:400;font-size:.8rem;color:var(--ink-3);margin-right:8px;vertical-align:.35em}
.fc-t{font-weight:700;font-size:1rem;line-height:1.5}
.fc-p{margin:0;font-size:.86rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden}
.fc-end{margin-top:auto;padding-top:8px;border-top:1px dashed var(--line);font-size:.78rem;color:var(--ink-3)}

/* 匹配 */
.ctl{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px 18px;
  display:grid;gap:10px}
.ctl-row{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:12px;align-items:start}
.ctl-row>span{font-size:.82rem;color:var(--ink-3);padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line-2);background:transparent;border-radius:999px;
  padding:4px 13px;font-size:.84rem;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--patina);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--patina);border-color:var(--patina);color:var(--paper)}
.hits{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin:18px 0 8px;font-size:.84rem;color:var(--ink-3)}
.hits b{font-family:var(--serif);font-size:1.25rem;color:var(--ink);margin:0 3px}

/* 政策行 */
.pols{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:4px}
.pols li+li{border-top:1px solid var(--line)}
.pol{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:14px;align-items:center;
  padding:13px 18px;text-decoration:none;color:inherit}
.pol:hover,.pol:focus-visible{background:var(--patina-soft)}
.pol-t{display:block;font-weight:700;font-size:.95rem;line-height:1.45}
.pol-s{display:block;font-size:.8rem;color:var(--ink-3);margin-top:2px}
.lim{color:var(--seal)}
.pol-a{text-align:right;min-width:7em}
.pol-a b{display:block;font-family:var(--serif);font-weight:900;font-size:1.12rem;line-height:1.3;white-space:nowrap}
.pol-a small{display:block;font-size:.72rem;color:var(--ink-3);max-width:14em;margin-left:auto;line-height:1.4}
.more{display:block;margin:12px auto 0;appearance:none;background:transparent;border:1px solid var(--line-2);
  border-radius:3px;padding:7px 18px;font-size:.86rem;color:var(--ink-2);cursor:pointer}
.more:hover{border-color:var(--patina);color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--ink-3);font-size:.9rem}

/* 时间节点 */
.tl{position:relative;height:330px;margin:10px 8px 0}
.tl-axis{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line-2)}
.tl-year{position:absolute;top:calc(50% + 8px);transform:translateX(-50%);font-size:.74rem;color:var(--ink-3)}
.tl-year::before{content:"";position:absolute;left:50%;top:-12px;width:1px;height:8px;background:var(--line-2)}
.tl-today{position:absolute;top:18%;bottom:18%;width:0;border-left:1.5px dashed var(--patina)}
.tl-today span{position:absolute;bottom:-22px;left:0;transform:translateX(-50%);white-space:nowrap;
  font-size:.74rem;color:var(--patina);font-weight:500}
.tl-node{position:absolute;top:50%;width:0}
.tl-dot{position:absolute;left:-7px;top:-6px;width:14px;height:14px;border-radius:50%;
  background:var(--paper);border:3px solid var(--seal)}
.tl-node.approx .tl-dot{border-style:dotted}
.tl-card{position:absolute;left:0;width:206px;transform:translateX(-50%);background:var(--paper);
  border:1px solid var(--line);border-radius:4px;padding:9px 12px;font-size:.78rem;line-height:1.5}
.tl-node.up .tl-card{bottom:22px}
.tl-node.edge-l .tl-card{transform:translateX(-18px)}
.tl-node.edge-r .tl-card{transform:translateX(calc(-100% + 18px))}
.tl-node.down .tl-card{top:26px}
.tl-card b{display:block;font-family:var(--serif);font-size:.98rem;color:var(--ink)}
.tl-card em{font-style:normal;color:var(--seal);font-weight:700}
.tl-card ul{margin:3px 0 0;padding-left:1.1em;color:var(--ink-2)}
.tl-note{margin:14px 0 0;font-size:.8rem;color:var(--ink-3)}
.tl-list{display:none}

/* 方向 */
.dgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.dt{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);
  border-top:3px solid var(--tile);border-radius:4px;padding:16px;text-decoration:none;color:inherit}
.dt:hover,.dt:focus-visible{border-color:var(--patina);border-top-color:var(--patina)}
.dt-n{font-family:var(--serif);font-weight:900;font-size:2.2rem;line-height:1}
.dt-n small{font-family:var(--sans);font-weight:400;font-size:.8rem;color:var(--ink-3);margin-left:4px}
.dt-name{font-weight:700;font-size:.92rem;line-height:1.4}
.dt-max{font-size:.78rem;color:var(--ink-3)}
.dt ul{margin:4px 0 0;padding:0;list-style:none;font-size:.78rem;color:var(--ink-2);line-height:1.5}
.dt li{padding-left:.9em;text-indent:-.9em}
.dt li::before{content:"· "}
.d-note{margin:14px 0 0;font-size:.82rem;color:var(--ink-3)}

/* 列表页 */
.lh{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin:34px 0 16px}
.lh h2{font-family:var(--serif);font-weight:900;font-size:1.6rem;margin:0}
.lh p{margin:4px 0 0;font-size:.84rem;color:var(--ink-3)}
.search{min-width:260px;flex:0 1 340px;padding:8px 12px;border:1px solid var(--line-2);border-radius:3px;
  background:var(--paper);color:var(--ink);font:inherit;font-size:.9rem}
.back{display:inline-block;margin-top:30px;font-size:.86rem;text-decoration:none;color:var(--ink-2)}
.back:hover{color:var(--patina)}

/* 详情页 */
.dh{display:flex;gap:16px;align-items:flex-start;margin:18px 0 22px;padding-bottom:18px;border-bottom:1px solid var(--line-2)}
.dh .seal{width:44px;height:44px;font-size:1.2rem}
.dh h2{font-family:var(--serif);font-weight:900;font-size:clamp(1.4rem,3vw,1.9rem);line-height:1.35;margin:0 0 8px;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.74rem;padding:1px 8px;border-radius:2px;background:var(--paper-2);color:var(--ink-2)}
.tag.warn{background:var(--seal-soft);color:var(--seal)}
.dgrid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.facts{display:grid;gap:18px}
.fact h3{margin:0 0 5px;font-size:.8rem;font-weight:500;letter-spacing:.08em;color:var(--ink-3)}
.fact p{margin:0;font-size:.94rem;color:var(--ink);max-width:44em}
.key{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--patina);border-radius:3px;padding:14px 18px}
.key p{font-size:1rem;font-weight:500}
.key small{display:block;margin-top:6px;font-size:.76rem;color:var(--ink-3)}
blockquote{margin:0;padding:14px 18px;background:var(--paper);border:1px solid var(--line);border-radius:3px;
  font-family:var(--serif);font-size:.92rem;line-height:1.95;color:var(--ink-2)}
.src{margin:8px 0 0;font-size:.8rem;color:var(--ink-3)}
.btn{display:inline-block;margin-top:10px;padding:7px 16px;border-radius:3px;background:var(--tile);
  color:var(--tile-ink);text-decoration:none;font-size:.86rem}
.btn:hover{filter:brightness(1.15)}
.aside{position:sticky;top:64px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.aside-amt{background:var(--tile);color:var(--tile-ink);padding:16px 18px}
.aside-amt span{font-size:.76rem;color:var(--tile-ink-2)}
.aside-amt b{display:block;font-family:var(--serif);font-weight:900;font-size:2rem;line-height:1.2}
.aside-amt small{display:block;font-size:.78rem;color:var(--tile-ink-2);margin-top:2px}
.aside dl{margin:0;padding:6px 18px 14px}
.aside dt{margin-top:12px;font-size:.74rem;letter-spacing:.06em;color:var(--ink-3)}
.aside dd{margin:2px 0 0;font-size:.86rem;line-height:1.6}
.internal{margin-top:16px;padding:12px 14px;border:1px dashed var(--seal);border-radius:3px;font-size:.8rem;color:var(--ink-2)}
.internal b{color:var(--seal);font-weight:500}

/* 内部版 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:26px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 14px}
.stat b{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1.2}
.stat span{font-size:.76rem;color:var(--ink-3)}
.lead{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--seal);border-radius:3px;
  padding:13px 16px;margin-bottom:10px;font-size:.86rem}
.lead h4{margin:0 0 6px;font-size:.95rem}
.lead p{margin:3px 0;color:var(--ink-2)}
.lead p b{color:var(--ink-3);font-weight:400;margin-right:6px}

footer{border-top:1px solid var(--line-2);padding:22px 0 40px;font-size:.78rem;color:var(--ink-3)}
footer p{margin:0 0 6px;max-width:60em}

/* ===== v2：分步匹配 ===== */
.demo-note{margin:0 0 18px;padding:9px 14px;border:1px dashed var(--seal);border-radius:3px;font-size:.82rem;color:var(--ink-2);background:var(--paper)}
.demo-note b{color:var(--seal);font-weight:500}
.wz{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:22px;align-items:start}
.wz-card{position:sticky;top:64px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.wz-prog{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:14px 18px 0}
.wz-prog span{height:4px;border-radius:2px;background:var(--line)}
.wz-prog span.on{background:var(--patina)}
.wz-prog span.cur{background:var(--seal)}
.wz-body{padding:14px 18px 18px}
.wz-k{margin:0;font-size:.76rem;letter-spacing:.1em;color:var(--ink-3)}
.wz-q{margin:4px 0 4px;font-family:var(--serif);font-weight:900;font-size:1.25rem;line-height:1.4}
.wz-h{margin:0 0 14px;font-size:.8rem;color:var(--ink-3)}
.opts{display:grid;gap:8px}
.opt{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 14px;border:1px solid var(--line-2);border-radius:3px;background:transparent;cursor:pointer;font-size:.92rem;color:var(--ink)}
.opt small{font-size:.76rem;color:var(--ink-3)}
.opt:hover{border-color:var(--patina)}
.opt[aria-pressed="true"]{border-color:var(--patina);background:var(--patina-soft)}
.opt[aria-pressed="true"]::after{content:"已选";font-size:.72rem;color:var(--patina);flex:none}
.wz-nav{display:flex;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:var(--paper-2)}
.wz-nav button{appearance:none;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);border-radius:3px;padding:6px 14px;font-size:.84rem;cursor:pointer}
.wz-nav button.go{background:var(--tile);color:var(--tile-ink);border-color:var(--tile)}
.wz-nav button:disabled{opacity:.4;cursor:default}
.wz-nav .clr{margin-right:auto;border:none;background:transparent;color:var(--seal);text-decoration:underline;padding:6px 4px}
.wz-nav .clr[hidden]{display:none}
.ans{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.ans button{appearance:none;border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:.8rem;color:var(--ink-2);cursor:pointer}
.ans button b{font-weight:500;color:var(--ink)}
.ans button:hover{border-color:var(--patina)}
.ans .ans-clr{border-color:transparent;background:transparent;color:var(--seal);text-decoration:underline}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.sum div{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:12px 16px}
.sum div:first-child{background:var(--tile);color:var(--tile-ink);border-color:var(--tile)}
.sum b{display:block;font-family:var(--serif);font-weight:900;font-size:1.7rem;line-height:1.2}
.sum span{font-size:.76rem;opacity:.8}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 8px}
.grp-h h3{margin:0;font-size:1rem;font-family:var(--serif);font-weight:900}
.grp-h p{margin:0;font-size:.78rem;color:var(--ink-3)}
.stg{display:inline-block;margin-left:6px;padding:0 6px;border-radius:2px;font-size:.7rem;font-weight:400;background:var(--patina-soft);color:var(--patina);vertical-align:1px}
.stg.warn{background:var(--seal-soft);color:var(--seal)}
details.blocked summary{cursor:pointer;font-size:.84rem;color:var(--ink-3);margin:18px 0 8px}

.wz-empty{background:var(--paper);border:1px dashed var(--line-2);border-radius:4px;padding:26px 24px;color:var(--ink-3);font-size:.9rem}
.wz-empty b{font-family:var(--serif);font-weight:900;font-size:2rem;color:var(--ink);margin-right:4px}
.wz-empty p{margin:8px 0 0;max-width:34em}
/* ===== v2：资格自查 ===== */
.ck{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ck-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.ck-h h4{margin:0;font-size:.8rem;font-weight:500;color:var(--ink-3)}
.ck-v{font-size:.86rem;font-weight:700}
.ck-v.ok{color:var(--patina)} .ck-v.no{color:var(--seal)} .ck-v.q{color:var(--ink-2)}
.ck ul{list-style:none;margin:0;padding:0}
.ck li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;font-size:.9rem}
.ck li+li{border-top:1px dashed var(--line)}
.ck li small{display:block;font-size:.74rem;color:var(--ink-3)}
.st{appearance:none;min-width:5.2em;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);background:transparent;
  font-size:.78rem;color:var(--ink-3);cursor:pointer}
.st.ok{border-color:var(--patina);background:var(--patina-soft);color:var(--patina)}
.st.no{border-color:var(--seal);background:var(--seal-soft);color:var(--seal)}
.st[disabled]{cursor:default}
.ck-f{margin:0;padding:9px 16px;font-size:.74rem;color:var(--ink-3);background:var(--paper-2)}

/* ===== v2：时间节点（内部版） ===== */
.tlx{position:relative;height:66px;margin:6px 12px 18px}
.tlx-axis{position:absolute;left:0;right:0;top:20px;height:2px;background:var(--line-2)}
.tlx-y{position:absolute;top:30px;transform:translateX(-50%);font-size:.72rem;color:var(--ink-3)}
.tlx-y::before{content:"";position:absolute;left:50%;top:-12px;width:1px;height:7px;background:var(--line-2)}
.tlx-dot{position:absolute;top:14px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--paper);
  border:3px solid var(--patina);display:grid;place-items:center;font-size:0}
.tlx-dot.soon{border-color:var(--seal)} .tlx-dot.approx{border-style:dotted}
.tlx-dot b{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:700;color:var(--ink-2)}

function fitsNow(p){var e=EFF[W.stage]||[W.stage];return p.st.some(function(x){return e.indexOf(x)>-1;});}
var STEPS=[
  {k:'dir',t:'招商方向',q:'项目属于哪个招商方向？',h:'各方向通用的政策会自动并入结果。',
   o:[['all','尚未确定']].concat(D.dirs.map(function(d){return [d.k,d.full];}))},
  {k:'stage',t:'项目阶段',q:'项目目前进展到哪一步？',h:'据此区分现在就能申报的政策，与项目推进后才能申报的政策。',
   o:[['拟落地','拟落地','洽谈签约、尚未注册'],['在建','在建','已开工建设'],['已运营','已运营','已开业经营'],['已达标','已达标','已获评级或营收达到台阶']]},
  {k:'inv',t:'投资规模',q:'计划总投资大约多少？',h:'用于排除设有投资额门槛、项目规模达不到的条款。',
   o:[['na','暂不确定'],['0-1000','1000 万元以下'],['1000-10000','1000 万元至 1 亿元'],['10000-30000','1 亿元至 3 亿元'],['30000-','3 亿元以上']]},
  {k:'subj',t:'申报主体',q:'由谁来申报？',h:'政策的申报主体各不相同，按主体类型筛选。',
   o:[['all','尚未确定'],['op','古镇或片区运营主体'],['biz','入驻企业或商户'],['event','活动、赛事主办方']]}
];
var W={step:0,dir:null,stage:null,inv:null,subj:null,more:{}};
function optLabel(k,v){if(v==null)return '未选';var st=STEPS.filter(function(x){return x.k===k;})[0];var o=st.o.filter(function(x){return x[0]===v;})[0];return o?o[1]:'';}
function invRange(){if(!W.inv||W.inv==='na')return null;var p=W.inv.split('-');return [+p[0],p[1]===''?Infinity:+p[1]];}
function wan(v){return v>=10000?(v/10000)+' 亿元':v+' 万元';}
function drawWiz(){
  var st=STEPS[W.step];
  $('wprog').innerHTML=STEPS.map(function(x,i){return '<span class="'+(i===W.step?'cur':(W[x.k]!=null?'on':''))+'"></span>';}).join('');
  $('wbody').innerHTML='<p class="wz-k">第 '+(W.step+1)+' 题 / 共 '+STEPS.length+' 题　'+st.t+'</p>'+
    '<p class="wz-q">'+st.q+'</p><p class="wz-h">'+st.h+'</p><div class="opts" role="group" aria-label="'+st.t+'">'+
    st.o.map(function(o){return '<button type="button" class="opt" data-v="'+esc(o[0])+'" aria-pressed="'+(W[st.k]===o[0])+'"><span>'+esc(o[1])+(o[2]?'<br><small>'+esc(o[2])+'</small>':'')+'</span></button>';}).join('')+'</div>';
  $('wprev').disabled=W.step===0;
  $('wclr').hidden=!STEPS.some(function(x){return W[x.k]!=null;});
  $('wnext').textContent=W.step===STEPS.length-1?'查看结果':'下一题';
}
$('wbody').addEventListener('click',function(e){
  var b=e.target.closest('.opt'); if(!b) return;
  W[STEPS[W.step].k]=b.getAttribute('data-v'); W.more={};
  if(W.step<STEPS.length-1) W.step++;
  drawWiz(); drawRes();
});
$('wprev').addEventListener('click',function(){if(W.step>0){W.step--;drawWiz();}});
$('wclr').addEventListener('click',function(){STEPS.forEach(function(x){W[x.k]=null;});W.step=0;W.more={};drawWiz();drawRes();$('wbody').querySelector('.opt').focus();});
$('wnext').addEventListener('click',function(){
  if(W.step<STEPS.length-1){W.step++;drawWiz();} else {$('wres').scrollIntoView({block:'start'});}
});
function invTag(p){
  if(!p.inv) return '';
  return '<span class="stg'+(p.inv[1]?'':' warn')+'">'+(p.inv[1]?'部分档位':'')+'需投资 '+wan(p.inv[0])+'</span>';
}
function rowV2(p,extra){
  return '<li><a class="pol" href="#/p/'+encodeURIComponent(p.id)+'">'+
    '<span class="seal lv-'+esc(p.lv)+'" title="'+esc(p.lv)+'级政策">'+esc(p.lv)+'</span>'+
    '<span><span class="pol-t">'+esc(p.t)+(extra||'')+'</span><span class="pol-s">'+sub(p)+'</span></span>'+
    '<span class="pol-a"><b>'+(p.amtT?esc(p.amtT):'按标准核定')+'</b><small>'+esc(p.end?'有效至 '+p.end:'')+'</small></span>'+
  '</a></li>';
}
function block(key,arr,fmt){
  var n=W.more[key]?arr.length:Math.min(arr.length,6);
  return '<ul class="pols">'+(arr.length?arr.slice(0,n).map(fmt).join(''):'<li class="empty">暂无</li>')+'</ul>'+
    (arr.length>n?'<button class="more" type="button" data-more="'+key+'">显示全部 '+arr.length+' 条</button>':'');
}
function drawRes(){
  if(!W.stage){
    $('wres').innerHTML='<div class="wz-empty"><b>'+D.policies.length+'</b> 条现行政策<p>回答左侧问题后，这里列出您的项目现阶段可申报、以及项目推进后可申报的政策。至少需要选择招商方向与项目阶段。</p></div>';
    return;
  }
  var si=STAGES.indexOf(W.stage), rg=invRange();
  var cand=D.policies.filter(function(p){
    return (!W.dir||W.dir==='all'||p.uni||p.dirs.indexOf(W.dir)>-1)&&(!W.subj||W.subj==='all'||p.subj.indexOf(W.subj)>-1);
  });
  var now=[],later=[],blocked=[];
  cand.forEach(function(p){
    if(rg&&p.inv&&!p.inv[1]&&p.inv[0]>rg[1]){blocked.push(p);return;}
    if(fitsNow(p)) now.push(p);
    else { var nx=p.st.map(function(x){return STAGES.indexOf(x);}).filter(function(i){return i>si;}).sort()[0];
      if(nx!=null){p._nx=STAGES[nx];later.push(p);} }
  });
  now.sort(sortAmt); later.sort(function(a,b){return STAGES.indexOf(a._nx)-STAGES.indexOf(b._nx)||sortAmt(a,b);}); blocked.sort(sortAmt);
  var top=now.length?now[0]:null;
  $('wres').innerHTML=
    '<div class="ans">'+STEPS.map(function(x,i){return '<button type="button" data-step="'+i+'">'+x.t+'：<b>'+esc(optLabel(x.k,W[x.k]))+'</b></button>';}).join('')+'<button type="button" class="ans-clr" data-clear="1">清除已选</button></div>'+
    '<div class="sum"><div><b>'+now.length+'</b><span>现阶段可申报</span></div>'+
      '<div><b>'+later.length+'</b><span>项目推进后可申报</span></div>'+
      '<div><b>'+(top&&top.amtT?esc(top.amtT):'—')+'</b><span>现阶段单条上限最高</span></div></div>'+
    '<div class="grp-h"><h3>现阶段可申报</h3><p>'+(W.stage==='已达标'?'已达标项目同时处于运营阶段，运营类政策一并列入；':'')+'按支持上限排列</p></div>'+
    block('now',now,function(p){return rowV2(p,invTag(p));})+
    '<div class="grp-h"><h3>项目推进后可申报</h3><p>'+(W.stage==='已达标'?'已达标为最后阶段，无后续政策':'标签为最早可申报的阶段，宜提前准备材料')+'</p></div>'+
    block('later',later,function(p){return rowV2(p,'<span class="stg">'+esc(p._nx)+'后</span>'+invTag(p));})+
    (blocked.length?'<details class="blocked"><summary>另有 '+blocked.length+' 条的投资额门槛高于所选规模，已排除（点击查看）</summary>'+
      '<ul class="pols">'+blocked.map(function(p){return rowV2(p,invTag(p));}).join('')+'</ul></details>':'');
}
$('wres').addEventListener('click',function(e){
  if(e.target.closest('[data-clear]')){$('wclr').click();$('wprog').scrollIntoView({block:'nearest'});return;}
  var m=e.target.closest('[data-more]'); if(m){W.more[m.getAttribute('data-more')]=true;drawRes();return;}
  var a=e.target.closest('[data-step]'); if(a){W.step=+a.getAttribute('data-step');drawWiz();$('wprog').scrollIntoView({block:'nearest'});}
});
drawWiz(); drawRes();

var CK={}; try{CK=JSON.parse(localStorage.getItem('ld-ck')||'{}');}catch(e){}
function saveCK(){try{localStorage.setItem('ld-ck',JSON.stringify(CK));}catch(e){}}
var STL={ok:'满足',no:'不满足',q:'待确认'};
function checklist(p){
  var rows=[], m=CK[p.id]||{}, si=STAGES.indexOf(W.stage), rg=invRange();
  var fn=W.stage&&fitsNow(p);
  rows.push({t:'适用阶段：'+p.st.join('、'),s:fn?'ok':'q',
    auto:W.stage?'依据项目匹配中所选阶段「'+W.stage+'」'+(fn?'':'，当前阶段不适用或须项目推进后申报'):'尚未在「项目匹配」中选择项目阶段'});
  if(p.inv){var v=p.inv[0];
    rows.push({t:'投资额达到 '+wan(v)+(p.inv[1]?'（仅部分档位要求）':''),
      s:!rg?'q':(rg[0]>=v?'ok':(rg[1]<v&&!p.inv[1]?'no':'q')),auto:rg?'依据所选投资规模「'+optLabel('inv',W.inv)+'」':'未选择投资规模'});}
  (p.elig||'').split(/[；;]/).map(function(x){return x.trim().replace(/。$/,'');}).filter(function(x){return x.length>3;})
    .forEach(function(x,i){rows.push({t:x,s:m[i]||'q',i:i});});
  var c={ok:0,no:0,q:0}; rows.forEach(function(r){c[r.s]++;});
  var v=c.no?['no','存在不满足项，暂不具备申报条件']:(c.q?['q','尚有 '+c.q+' 项待确认']:['ok','各项初步满足，建议联系受理部门确认']);
  return '<div class="fact"><h3>申报条件 · 资格自查</h3><div class="ck" data-pid="'+esc(p.id)+'"><div class="ck-h"><h4>满足 '+c.ok+' · 不满足 '+c.no+' · 待确认 '+c.q+'</h4><span class="ck-v '+v[0]+'">'+v[1]+'</span></div><ul>'+
    rows.map(function(r){return '<li><span>'+esc(r.t)+(r.auto?'<small>自动判断：'+esc(r.auto)+'</small>':'')+'</span>'+
      '<button type="button" class="st '+r.s+'"'+(r.auto?' disabled':' data-i="'+r.i+'"')+' aria-label="切换状态，当前'+STL[r.s]+'">'+STL[r.s]+'</button></li>';}).join('')+
    '</ul><p class="ck-f">点击条目右侧的状态，可在「待确认 / 满足 / 不满足」之间切换。结果仅保存在本机浏览器，不构成资格认定。</p></div></div>';
}

/* 路由 */
var VIEWS=['v-home','v-list','v-detail','v-pending'];
function show(v){VIEWS.forEach(function(x){$(x).hidden=(x!==v);});}
function mark(k){[].forEach.call(document.querySelectorAll('#nav a'),function(a){a.setAttribute('aria-current',String(a.getAttribute('data-k')===k));});}
var lastList='#/';
var HASH=location.hash||'#/';
function go(href){HASH=href; try{history.replaceState(null,'',href);}catch(e){} route();}
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href^="#/"]'); if(!a||e.defaultPrevented||a.hasAttribute('data-scroll')) return;
  e.preventDefault(); go(a.getAttribute('href'));
});
function route(){
  var h=(HASH||'').replace(/^#\/?/,''), parts=h.split('/');
  if(parts[0]==='d'&&dirName[parts[1]]){
    var d=dirName[parts[1]];
    LIST=D.policies.filter(function(p){return p.dirs.indexOf(d.k)>-1;}).sort(sortAmt);
    $('lt').textContent=d.full; $('lq').value=''; drawList(); show('v-list'); mark('dirs'); lastList=HASH; window.scrollTo(0,0);
  } else if(parts[0]==='all'){
    LIST=D.policies.slice().sort(sortAmt);
    $('lt').textContent='全部政策'; $('lq').value=''; drawList(); show('v-list'); mark('all'); lastList=HASH; window.scrollTo(0,0);
  } else if(parts[0]==='p'&&P[decodeURIComponent(parts[1]||'')]){
    drawDetail(P[decodeURIComponent(parts[1])]); $('dback').href=lastList; show('v-detail'); mark(''); window.scrollTo(0,0);
  } else if(parts[0]==='pending'&&IN){
    drawPending(); show('v-pending'); mark('pending'); window.scrollTo(0,0);
  } else {
    show('v-home'); mark(''); document.title=IN?'洛带政策指引内部版':'洛带招商政策指引';
    if(pendingScroll){var t=pendingScroll; pendingScroll=null; setTimeout(function(){var el=$(t); if(el) el.scrollIntoView();},0);}
    else if(h) window.scrollTo(0,0);
    lastList='#/';
  }
}
window.addEventListener('hashchange',function(){HASH=location.hash||'#/';route();});
route();
})();
</script>
